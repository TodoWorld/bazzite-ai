# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-ai
description: This is pre-install some AI tools OS image.

base-image: ghcr.io/ublue-os/bazzite-gdx
image-version: latest

modules:

  # Install downgraded kernel for ROCm support and other packages
  - type: rpm-ostree
    install:
      - rpm-build
      - rpmdevtools
      - gcc
      - make
      - git
      - obs-studio
      - flatpak-xdg-utils
      - snapd

  # Install Juju and deploy Charmed Kubeflow
  - type: script
    scripts:
      - |
        #!/bin/bash
        set -e

        # Install Juju
        snap install juju --classic

        # Add Juju repository for Charmed Kubeflow
        juju deploy kubeflow --channel 1.10/stable
